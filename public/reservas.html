<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | VOLTMOTION</title>

    <!-- ENLACE PARA USAR BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!--Link para poder utilizar JS con bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <link id="theme-style" rel="stylesheet" href="style.css"> <!--el id es importante para poder cambiar entre estilos-->
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-md navbar-light bg-light" aria-label="Navegación principal">
            <div class="container-fluid">
                <a class="navbar-brand ms-3" href="index.html">
                    <img src="img/logo.jpg" alt="logo" width="60" height="60">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="vehiculos.html">Vehiculos</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="reservas.html">Reservas</a>
                        </li>
                        <li class="nav-item">  <!--data-bs-toogle: informa a Bootstrap que este link abre un offcanvas
                                                hrfef: indica que offcanvas abre por id
                                                role:importante para accesibilidad: el lector de pantalla entiende que, aunque parezca un enlace, se comporta como un botón
                                                aria-controls: asocia control con el panel que gobierna -->
                            <a class="nav-link" 
                            data-bs-toggle="offcanvas"     
                            href="#offcanvasRight" 
                            role="button" 
                            aria-controls="offcanvasRight"
                            aria-label="Abrir panel de cuenta">
                            Cuenta
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" 
                                data-bs-toggle="offcanvas"     
                                href="#offcanvasSettings" 
                                role="button" 
                                aria-controls="offcanvasSettings"
                                aria-label="Abrir panel de ajustes">
                                Ajustes
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
                <div class="offcanvas-header"> <!--Cogido de bootstrap-->
                        <h5 id="offcanvasRightLabel">Accede a tu cuenta</h5>
                        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                        <span class="error" id="error-email" aria-live="polite"></span>
                    </div>
                        <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password"
                        name="password">
                        <span class="error" id="error-password" aria-live="polite"></span>
                    </div>
                    <div class="signIn-buttons mt-4 d-grid gap-3">
                            <button class="btn btn-primary" type="button">Iniciar sesion</button>
                            <button class="btn btn-primary" type="button">Crear cuenta</button>
                    </div>
                </div>
        </div>

        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasSettings" aria-labelledby="offcanvasSettingsLabel">
            <div class="offcanvas-header"> <!--Cogido de bootstrap-->
                        <h5 id="offcanvasSettingsLabel">Ajustes</h5>
                        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="offcanvas-bar">
                    <li class="nav-item">
                        <a id = "nav-contraste" class="nav-link" href="#" aria-label="Alternar modo de alto contraste"
                            role="button" aria-pressed="false">
                            Contraste
                        </a>
                    </li>
                    <li class="nav-item">
                        <label for="select-idioma" class="form-label">Idioma</label>
                        <select name="select-idioma" id="select-idioma" aria-label="Selector de idioma">
                            <option value="es" lang="es" selected>Español</option>
                            <option value="en" lang="en">English</option>
                        </select>
                    </li>
                </ul>
            </div>
        </div>
    </header>
    <main>
            <section id="reservas" class="container mt-5" aria-labelledby="titulo-reservas">
            <h2 id="titulo-reservas" class="mb-4">Reserva tu vehículo</h2>

            <form id="form-reserva" novalidate>
                <!-- Nombre y apellidos -->
                <div class="mb-3">
                <label for="nombre-reserva" class="form-label">Nombre y apellidos</label>
                <input type="text"
                        id="nombre-reserva"
                        name="nombre"
                        class="form-control"
                        required
                        minlength="3">
                <span class="error" id="error-nombre" aria-live="polite"></span>
                </div>

                <!-- Correo electrónico -->
                <div class="mb-3">
                <label for="email-reserva" class="form-label">Correo electrónico</label>
                <input type="email"
                        id="email-reserva"
                        name="email"
                        class="form-control"
                        required>
                <span class="error" id="error-email" aria-live="polite"></span>
                </div>

                <!-- Fecha de reserva -->
                <div class="mb-3">
                <label for="fecha-reserva" class="form-label">Fecha de reserva</label>
                <input type="datetime-local"
                        id="fecha-reserva"
                        name="fecha-reserva"
                        class="form-control"
                        required>
                <span class="error" id="error-fecha" aria-live="polite"></span>
                </div>

                <!-- Datos del vehículo (si no existe tabla vehiculos) -->
                <div class="mb-3">
                <label for="vehiculo-marca" class="form-label">Marca</label>
                <input id="vehiculo-marca" name="vehiculo-marca" class="form-control" placeholder="Ej: Tesla">
                </div>

                <div class="mb-3">
                <label for="vehiculo-modelo" class="form-label">Modelo</label>
                <input id="vehiculo-modelo" name="vehiculo-modelo" class="form-control" placeholder="Ej: Model 3">
                </div>

                <div class="mb-3">
                <label for="vehiculo-matricula" class="form-label">Matrícula (opcional)</label>
                <input id="vehiculo-matricula" name="vehiculo-matricula" class="form-control" placeholder="1234-ABC">
                </div>


                <!-- Duración de la reserva -->
                <div class="mb-3">
                <label for="duracion" class="form-label">Duración de la reserva (horas)</label>
                <input type="number"
                        id="duracion"
                        name="duracion"
                        class="form-control"
                        min="1"
                        step="1"
                        required>
                <span class="error" id="error-duracion" aria-live="polite"></span>
                </div>

                <!-- Barra de progreso -->
                <div class="mb-3">
                <div class="progress">
                    <div class="progress-bar"
                        id="form-progress"
                        role="progressbar"
                        style="width: 0%;"
                        aria-valuenow="0"
                        aria-valuemin="0"
                        aria-valuemax="100">
                    </div>
                </div>
                <p class="mt-2 mb-0 small text-muted" id="progress-text">
                    Compleción del formulario: 0%
                </p>
                </div>

                <!-- Botones -->
                <div class="d-flex gap-3">
                <button type="submit" class="btn btn-primary">Enviar reserva</button>
                <button type="button" class="btn btn-secondary" id="btn-reset-reserva">
                    Borrar formulario
                </button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <div class="div text-center mt-5">
         <p >
            Plataforma académica de demostración. Todos los derechos reservados &copy; 2025.
        </p>
        </div>
    </footer>
</body>
<script src="formulario.js"></script>
<script src="js/api.js"></script>
<script src="js/reservas-ui.js"></script>
<script src="js/accesibility-ui.js"></script>
<script src="js/auth-ui.js"></script>
</html>
