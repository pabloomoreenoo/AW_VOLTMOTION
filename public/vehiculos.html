<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehiculos</title>

    <!-- ENLACE PARA USAR BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <link id="theme-style" rel="stylesheet" href="style.css"> <!--el id es importante para poder cambiar entre estilos-->
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-md navbar-light bg-light" aria-label="Navegación principal">
            <div class="container-fluid">
                <a class="navbar-brand ms-3" href="index.html">
                    <img src="img/logo.jpg" alt="logo" width="60" height="60">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="vehiculos.html">Vehiculos</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="reservas.html">Reservas</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel" role="dialog">
                <div class="offcanvas-header"> <!--Cogido de bootstrap-->
                        <h5 id="offcanvasRightLabel">Accede a tu cuenta</h5>
                        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <div id="offcanvas-account-body">
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com">
                            <span class="error" id="error-email" aria-live="polite"></span>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password"
                            name="password">
                            <span class="error" id="error-password" aria-live="polite"></span>
                        </div>
                        <div class="signIn-buttons mt-4 d-grid gap-3">
                                <button class="btn btn-primary" type="button" id="LoginButton">Iniciar sesion</button>
                                <button class="btn btn-primary" type="button" id="openRegisterModal">Crear cuenta</button>
                        </div>
                    </div>
                </div>
        </div>

    </header>

    <main>
        <h1 class="mb-3 mt-3 text-center">Vehículos disponibles:</h1>

        <section aria-labelledby="filtro-title" class="mb-4">
            <h2 id="filtro-title" class="h5 visually-hidden">Filtro de concesionarios</h2>

            <div class="row g-2 align-items-center ms-3">
                <div class="col-12 col-md-3">
                    <label for="select-concesionario" class="form-label">Concesionario</label>
                    <select id="select-concesionario" class="form-select" aria-label="Seleccionar concesionario">
                        <option value="all">— Todos los concesionarios —</option>
                    </select>
                </div>

                <div class="col-12 col-md-2">
                    <label for="input-autonomia" class="form-label">Autonomía mínima (km)</label>
                    <input id="input-autonomia" type="number" min="0" step="1" class="form-control" placeholder="e.g. 200" aria-label="Autonomía mínima">
                </div>

                <div class="col-12 col-md-2">
                    <label for="input-plazas" class="form-label">Plazas mínimas</label>
                    <input id="input-plazas" type="number" min="1" step="1" class="form-control" placeholder="e.g. 4" aria-label="Plazas mínimas">
                </div>

                <div class="col-12 col-md-3">
                    <label for="select-color" class="form-label">Color</label>
                    <select id="select-color" class="form-select" aria-label="Seleccionar color">
                        <option value="">— Cualquiera —</option>
                        <!--  -->
                    </select>
                </div>

                <div class="col-12 col-md-2 d-grid">
                    <button id="btn-filter" class="btn btn-primary">Aplicar</button>
                    <button id="btn-reset-filters" class="btn btn-outline-secondary mt-2">Borrar filtros</button>
                </div>
            </div>
        </section>

        <section aria-live="polite" id="vehiculos-container">
            <div id="vehiculos-grid" class="row gy-4"></div>
            <div id="vehiculos-empty" class="text-muted mt-4" hidden>No se han encontrado vehículos.</div>
        </section>
        
    </main>

    <!-- ========================= PIE DE PÁGINA ========================= -->
    <footer>
        <div class="div text-center mt-5">
            <p >
        Plataforma académica de demostración. Todos los derechos reservados &copy; 2025.
        </p>
        </div>
    </footer>
    
    <!--Link para poder utilizar JS con bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="js/api.js"></script>
    <script src="js/accesibility-ui.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/hero-search.js"></script>
    <script src="js/auth-ui.js"></script>
    <script src="js/vehicles.js"></script>

    <script src="formulario.js"></script>
</body>
</html>
